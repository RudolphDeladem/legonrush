name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Quick ride in a test browser
        run: npm run smoke
      - name: Campus data is up to date
        run: |
          node scripts/osm-campus.mjs
          git diff --exit-code src/data/legon-map.json
